name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  testes:
    name: Testes automáticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  site:
    needs: testes
    name: Site (PWA) no GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK Android
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::APK não gerado: faltam os segredos KEYSTORE_BASE64 e KEYSTORE_PASSWORD (veja docs/desenvolvimento.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meu-dinheiro.keystore
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Compilar APK
        if: steps.chave.outputs.ok == 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../meu-dinheiro.apk
      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          name: meu-dinheiro-apk
          path: meu-dinheiro.apk
      - uses: softprops/action-gh-release@v2
        if: steps.chave.outputs.ok == 'true'
        with:
          tag_name: v1.${{ github.run_number }}
          name: Meu Dinheiro 1.${{ github.run_number }}
          body: |
            Baixe **meu-dinheiro.apk** no celular Android e abra o arquivo para instalar.
            Desenvolvido por Claudinei Nascimento.
          files: meu-dinheiro.apk
          make_latest: true
