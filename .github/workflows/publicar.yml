name: Publicar app

on:
  push:
    branches: [main]
  # Em pull requests: roda os testes e gera o APK para conferir (sem publicar nada).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes automáticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  site:
    needs: testes
    name: Site (PWA) no GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK Android
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Versão
        id: versao
        run: |
          VERSAO="$(node -p "require('./package.json').version")"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          # Publica um Release só na main e só quando a versão do package.json ainda não tem tag.
          PUBLICAR=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSAO" >/dev/null 2>&1; then
              echo "::notice::A versão $VERSAO já foi publicada (tag v$VERSAO). Para um novo Release, aumente \"version\" no package.json."
            else
              PUBLICAR=true
            fi
          fi
          echo "publicar=$PUBLICAR" >> "$GITHUB_OUTPUT"
          echo "Versão $VERSAO, build ${{ github.run_number }}, publicar=$PUBLICAR"
      - name: Chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::APK não gerado: faltam os segredos KEYSTORE_BASE64 e KEYSTORE_PASSWORD (veja docs/desenvolvimento.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::O segredo KEYSTORE_PASSWORD está vazio ou foi criado com outro nome."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/meu-dinheiro.keystore || { echo "::error::KEYSTORE_BASE64 não é um base64 válido. Copie o arquivo KEYSTORE_BASE64.txt inteiro."; exit 1; }
          PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          keytool -list -keystore android/app/meu-dinheiro.keystore -storepass "$PW" -alias meudinheiro >/dev/null 2>&1 || { echo "::error::A senha em KEYSTORE_PASSWORD não abre a chave. Confira se copiou o arquivo KEYSTORE_PASSWORD.txt sem espaços extras."; exit 1; }
          echo "::add-mask::$PW"
          echo "KEYSTORE_PASSWORD_LIMPA=$PW" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Compilar APK
        if: steps.chave.outputs.ok == 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.versao.outputs.versao }}
        run: |
          export KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD_LIMPA"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../meu-dinheiro.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs ../meu-dinheiro.apk | grep -i 'certificate DN' || true
          sha256sum ../meu-dinheiro.apk | tee ../meu-dinheiro.apk.sha256
      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          name: meu-dinheiro-${{ steps.versao.outputs.versao }}-apk
          path: |
            meu-dinheiro.apk
            meu-dinheiro.apk.sha256
      - name: Notas da versão
        if: steps.chave.outputs.ok == 'true' && steps.versao.outputs.publicar == 'true'
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          {
            echo "Baixe **meu-dinheiro.apk** no celular Android e abra o arquivo para instalar. Quem já tem o app instalado só atualiza: os dados continuam."
            echo
            # Trecho do CHANGELOG.md desta versão (do título "## X.Y" até o próximo "## ").
            awk -v v="${VERSAO%.0}" 'index($0,"## "v" ")==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md
            echo
            echo "Desenvolvido por Claudinei Nascimento."
          } > notas.md
          cat notas.md
      - uses: softprops/action-gh-release@v2
        if: steps.chave.outputs.ok == 'true' && steps.versao.outputs.publicar == 'true'
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          name: Meu Dinheiro ${{ steps.versao.outputs.versao }}
          body_path: notas.md
          files: |
            meu-dinheiro.apk
            meu-dinheiro.apk.sha256
          make_latest: true
