<body>
<title>Meu Dinheiro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de app de celular com barra inferior; em telas largas a barra vira trilho lateral. */
:root{
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#E8EEEE; --ink:#10242E; --muted:#56676F; --line:#D7E0E1;
  --brand:#0B5D4E; --brand-2:#0E7A66; --brand-ink:#FFFFFF; --brand-soft:#DDEFEA;
  --pos:#127A5A; --pos-soft:#DCF1E8; --neg:#BF3F2B; --neg-soft:#F8E2DD; --warn:#9A6408; --warn-soft:#F6EBD3;
  --shadow:0 1px 2px rgba(16,36,46,.06),0 4px 16px rgba(16,36,46,.06);
  --overlay:rgba(10,22,28,.45);
  --r:14px; --r-sm:10px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.9375rem; --fs-lg:1.125rem; --fs-xl:1.5rem; --fs-xxl:2rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1418; --surface:#132127; --surface-2:#1A2B32; --ink:#E5EDEE; --muted:#93A6AD; --line:#253840;
  --brand:#2F9C84; --brand-2:#3FB49A; --brand-ink:#04140F; --brand-soft:#16352E;
  --pos:#4CC79A; --pos-soft:#14352A; --neg:#F08672; --neg-soft:#3A1F1A; --warn:#E3B55E; --warn-soft:#3A2E15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6); color-scheme:dark;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767}}
:root[data-theme="dark"]{
  --bg:#0B1418; --surface:#132127; --surface-2:#1A2B32; --ink:#E5EDEE; --muted:#93A6AD; --line:#253840;
  --brand:#2F9C84; --brand-2:#3FB49A; --brand-ink:#04140F; --brand-soft:#16352E;
  --pos:#4CC79A; --pos-soft:#14352A; --neg:#F08672; --neg-soft:#3A1F1A; --warn:#E3B55E; --warn-soft:#3A2E15;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6); color-scheme:dark;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font);font-size:var(--fs-md);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}
.ico.lg{width:24px;height:24px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-md);letter-spacing:-.01em;margin-right:auto;min-width:0}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand-mark .ico{width:17px;height:17px;stroke-width:2.2}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month span{min-width:96px;text-align:center;font-weight:600;font-size:var(--fs-sm);text-transform:capitalize}
.iconbtn{border:0;background:transparent;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.themebtn{border:1px solid var(--line);background:var(--surface)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-h h2{font-size:var(--fs-lg)}
.eyebrow{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;border:0}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{font-size:var(--fs-xxl);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid color-mix(in srgb,var(--brand-ink) 22%,transparent);padding-top:12px}
.hero-row div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-row b{font-size:var(--fs-md);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-row span{font-size:var(--fs-xs);opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-size:var(--fs-lg);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main span{font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.row-end b{font-weight:600}
.cat-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.cat-ico .ico{width:19px;height:19px}
.day-h{font-size:var(--fs-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 2px;display:flex;justify-content:space-between}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.pos{background:var(--pos-soft)} .pill.neg{background:var(--neg-soft)} .pill.warn{background:var(--warn-soft)} .pill.mut{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:var(--fs-sm);font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px}
.search input{border:0;background:transparent;outline:0;padding:10px 0;flex:1;min-width:0}
.check{width:26px;height:26px;border-radius:99px;border:1.6px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);cursor:pointer;color:var(--muted)}
.check.on{background:var(--pos);border-color:var(--pos);color:var(--surface)}
.check .ico{width:14px;height:14px;stroke-width:2.6}

.btn{border:0;border-radius:var(--r-sm);padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:var(--fs-sm)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .cat-ico{width:52px;height:52px;border-radius:16px;background:var(--brand-soft);color:var(--brand)}
.empty b{color:var(--ink);font-size:var(--fs-md)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);font-size:var(--fs-sm);background:var(--warn-soft);color:var(--ink)}
.banner .ico{color:var(--warn);margin-top:1px}
.banner.info{background:var(--brand-soft)} .banner.info .ico{color:var(--brand)}
.banner-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.menu{display:flex;flex-direction:column}
.menu .row{padding:14px 0}
.menu .cat-ico{background:var(--surface-2);color:var(--ink)}
.signature{text-align:center;font-size:var(--fs-xs);color:var(--muted);padding:8px 0 0;display:flex;flex-direction:column;gap:2px}
.signature b{color:var(--ink);font-weight:600}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nav button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:.6875rem;font-weight:500;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"] .ico{stroke-width:2.2}
.fab{width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:var(--shadow);border:4px solid var(--bg)}
.fab .ico{width:26px;height:26px;stroke-width:2.4}
.nav .fab-wrap{padding:0 0 8px}
.nav .side-new{display:none}

@media (min-width:900px){
  .nav{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding:16px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .nav-in{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin-top:56px}
  .nav button{flex-direction:row;gap:12px;padding:10px 12px;border-radius:10px;font-size:var(--fs-md)}
  .nav button[aria-current="page"]{background:var(--brand-soft)}
  .nav .fab-wrap{display:none}
  .nav .side-new{display:flex;justify-content:center;margin-bottom:12px;background:var(--brand);color:var(--brand-ink);font-weight:600}
  .top,main{margin-left:232px}
  main{padding-bottom:40px}
}

/* Folha de formulário */
.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:88%}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;gap:8px}
.sheet-h h2{font-size:var(--fs-lg);margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:var(--fs-sm);font-weight:500;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;outline:0;min-width:0}
.input:focus{border-color:var(--brand-2)}
.money{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px}
.money span{font-size:var(--fs-lg);font-weight:600;color:var(--muted)}
.money input{border:0;outline:0;background:transparent;font-size:var(--fs-xxl);font-weight:700;width:100%;min-width:0;letter-spacing:-.02em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:600;font-size:var(--fs-sm);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.t-despesa button[aria-pressed="true"]{color:var(--neg)} .seg.t-receita button[aria-pressed="true"]{color:var(--pos)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.confirm{background:var(--neg-soft);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:var(--fs-sm)}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand-2)}
.inst{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.inst:last-child{border-bottom:0}
.inst .n{width:30px;font-weight:600;color:var(--muted);font-size:var(--fs-sm)}

details.faq{border-bottom:1px solid var(--line);padding:4px 0}
details.faq:last-child{border-bottom:0}
details.faq summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:500}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .ico:last-child{margin-left:auto;transition:transform .2s;color:var(--muted)}
details.faq[open] summary .ico:last-child{transform:rotate(90deg)}
details.faq p,details.faq ul{margin:0 0 10px;color:var(--muted);font-size:var(--fs-sm);max-width:65ch}
details.faq ul{padding-left:18px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:var(--fs-sm);font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:24px;left:calc(50% + 116px)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Tela de bloqueio */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.lock-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.lock-head .brand-mark{width:52px;height:52px;border-radius:16px}
.lock-head .brand-mark .ico{width:28px;height:28px}
.lock-head h1{font-size:var(--fs-xl);font-weight:600}
.pin-dots{display:flex;gap:14px;height:16px;align-items:center}
.pin-dots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--muted);display:block}
.pin-dots i.on{background:var(--brand);border-color:var(--brand)}
.pin-dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pin-msg{min-height:1.4em;font-size:var(--fs-sm);text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px}
.key{width:72px;height:72px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;font-weight:500;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.key:active{background:var(--surface-2)}
.key.flat{border:0;background:transparent}
.key:disabled{opacity:.4;cursor:default}
.key .ico{width:26px;height:26px}
.linkbtn{border:0;background:none;color:var(--brand-2);font-weight:600;cursor:pointer;font-size:var(--fs-sm);padding:6px}
.pinfield{letter-spacing:.4em;font-size:var(--fs-lg);text-align:center}
.codefield{letter-spacing:.12em;font-size:var(--fs-lg);text-align:center;text-transform:uppercase}

/* Olho (ocultar valores) */
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.eye{color:inherit;flex:none}
.hero .eye:hover{background:color-mix(in srgb,var(--brand-ink) 16%,transparent)}
.inv-card{flex-direction:row;align-items:center;gap:8px}
.inv-link{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}

/* Recuperação de PIN */
.lock-opts{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.lock-opts .row:disabled{opacity:.5;cursor:default}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.3rem;font-weight:600;letter-spacing:.08em;text-align:center;padding:14px 8px;border-radius:var(--r-sm);background:var(--surface);border:1.5px dashed var(--brand-2);user-select:all;word-break:break-all}

/* Backup */
.bk{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);font-size:var(--fs-sm);color:var(--muted)}
.bk>.ico{color:var(--pos)}

/* Painel de investimentos */
.stack{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%;min-width:3px}
.leg{display:flex;flex-direction:column}
.leg>div{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);min-width:0}
.leg>div:last-child{border-bottom:0}
.leg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.evo{display:flex;align-items:flex-end;gap:4px;height:128px;border-bottom:1px solid var(--line)}
.evo button{flex:1;height:100%;display:flex;align-items:flex-end;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.evo button i{display:block;width:100%;background:var(--s1);border-radius:4px 4px 0 0;min-height:2px;opacity:.5}
.evo button:hover i,.evo button[aria-pressed="true"] i{opacity:1}
.evo-x{display:flex;gap:4px;font-size:.625rem;color:var(--muted);margin-top:4px}
.evo-x span{flex:1;text-align:center;min-width:0;overflow:hidden;text-transform:capitalize}

/* 1.2: digital primeiro, barra de ferramentas, simulação, sobre */
.bio-btn{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--brand-2);background:var(--brand-soft);color:var(--brand);border-radius:20px;padding:14px 26px;font-weight:600;font-size:var(--fs-sm);cursor:pointer}
.bio-btn .ico{width:40px;height:40px;stroke-width:1.6}
.bio-btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;gap:8px;align-items:stretch}
.toolbar .search{flex:1;min-width:0}
.toolbar .btn{padding:8px 12px;flex:none}
@media (max-width:360px){.toolbar .tb-txt{display:none}}
.sim{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--fs-sm);line-height:1.5}
.sim:empty{display:none}
.about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.about>.brand-mark{width:56px;height:56px;border-radius:16px}
.about>.brand-mark .ico{width:30px;height:30px}
.about h2{font-size:var(--fs-xl)}
ul.news{margin:10px 0 6px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-sm)}
details.faq ul li{margin-bottom:4px}
.menu a.row:hover,.menu .row:hover{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.card>.eyebrow{display:block}

const addDays=(iso,k)=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1,d+k);return isoOf(t.getFullYear(),t.getMonth()+1,t.getDate())};

function removeDoc(col,id){
  if(mode!=='db'){persistLocal();return}

function put(col,obj,silent){
  if(!obj.id) obj.id=uid();

  const i=S[col].findIndex(x=>x.id===obj.id);
  if(i>=0) S[col][i]=obj; else S[col].push(obj);
  writeDoc(col,obj);
  if(!silent) render();
  return obj;
}
function del(col,id,silent){
  S[col]=S[col].filter(x=>x.id!==id);

/* ---------- Cálculos ---------- */
const cat=id=>S.categorias.find(c=>c.id===id);
const catByKey=k=>S.categorias.find(c=>c.chave===k);
const conta=id=>S.contas.find(c=>c.id===id);
const contasAtivas=()=>S.contas.filter(c=>c.ativa!==false);
function saldoConta(id){
  const c=conta(id); let s=c?(c.saldoInicial||0):0;
  for(const l of S.lancamentos){ if(l.status!=='pago')continue;
    if(l.tipo==='receita'&&l.contaId===id)s+=l.valor;
    else if(l.tipo==='despesa'&&l.contaId===id)s-=l.valor;
    else if(l.tipo==='transferencia'){if(l.contaId===id)s-=l.valor;if(l.contaDestinoId===id)s+=l.valor}}
  return s;
}
const contaNoResultado=l=>!l.mov; /* aportes, resgates e dinheiro emprestado não são receita nem gasto */
function resumoMes(ym){
  const ls=S.lancamentos.filter(l=>l.data&&ymOf(l.data)===ym&&contaNoResultado(l));
  const rec=ls.filter(l=>l.tipo==='receita'), des=ls.filter(l=>l.tipo==='despesa');
  return {receitas:sum(rec,l=>l.valor),despesas:sum(des,l=>l.valor),
    pagas:sum(des.filter(l=>l.status==='pago'),l=>l.valor),
    fixas:sum(des.filter(l=>l.natureza==='fixo'),l=>l.valor),variaveis:sum(des.filter(l=>l.natureza!=='fixo'),l=>l.valor),
    recebidas:sum(rec.filter(l=>l.status==='pago'),l=>l.valor),des};
}
function empInfo(e){
  const ps=e.parcelas||[]; const h=hoje();
  const abertas=ps.filter(p=>!p.pagoEm); const pagas=ps.length-abertas.length;
  const atrasadas=abertas.filter(p=>p.venc<h);
  const proxima=abertas.slice().sort((a,b)=>a.venc<b.venc?-1:1)[0]||null;
  return {saldo:sum(abertas,p=>p.valor),pagas,total:ps.length,atrasadas,atrasado:sum(atrasadas,p=>p.valor),proxima,quitado:ps.length>0&&!abertas.length};
}
function saldoInv(i){return sum(i.movimentos||[],m=>m.tipo==='resgate'?-m.valor:m.valor)}
/* aplicado = saldo inicial + aportes; o saldo é aplicado + rendimentos − resgates */
function invStats(i){let ap=0,res=0,rend=0;for(const m of i.movimentos||[]){if(m.tipo==='resgate')res+=m.valor;else if(m.tipo==='rendimento')rend+=m.valor;else ap+=m.valor}return {ap,res,rend,saldo:ap+rend-res}}
const pctFmt=x=>(x*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
/* média mensal das despesas essenciais nos últimos 3 meses com lançamentos */
function mediaEssencial(){const h=ymOf(hoje())+'-01';let tot=0,n=0;for(let k=0;k<3;k++){const ym=addMonths(h,-k).slice(0,7);const v=sum(S.lancamentos.filter(l=>l.tipo==='despesa'&&contaNoResultado(l)&&l.data&&ymOf(l.data)===ym&&(cat(l.categoriaId)||{}).grupo==='essencial'),l=>l.valor);if(v){tot+=v;n++}}return n?Math.round(tot/n):0}
/* saldo investido no fim de cada um dos últimos n meses */
function evolucaoInv(n){const h=ymOf(hoje())+'-01';const out=[];for(let k=n-1;k>=0;k--){const ym=addMonths(h,-k).slice(0,7);const fim=ym+'-31';let v=0;S.investimentos.forEach(i=>(i.movimentos||[]).forEach(m=>{if(m.data&&m.data<=fim)v+=m.tipo==='resgate'?-m.valor:m.valor}));out.push({ym,v})}return out}
function calcParcela(P,n,taxa){if(!n)return 0;const i=(taxa||0)/100;if(!i)return Math.round(P/n);return Math.round(P*i/(1-Math.pow(1+i,-n)))}

function openSheet(title,body,onMount){

function optsContas(sel,incluiArq){return contasAtivas().concat(incluiArq?S.contas.filter(c=>c.ativa===false&&c.id===sel):[]).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)}</option>`).join('')}
function optsCats(tipo,sel){
  const cs=S.categorias.filter(c=>c.tipo===tipo&&(!c.oculta||c.id===sel));
  if(tipo==='receita')return cs.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)}</option>`).join('');
  return ['essencial','estilo','financeiro'].map(g=>`<optgroup label="${GRUPOS[g]}">${cs.filter(c=>c.grupo===g).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)}</option>`).join('')}</optgroup>`).join('');
}

function formLanc(l){
  /* sem id = novo lançamento (pode vir com campos já preenchidos, como no "Pagar fatura") */
  const novo=!l||!l.id; l=Object.assign({tipo:'despesa',valor:0,data:hoje(),contaId:(contasAtivas()[0]||{}).id,natureza:'variavel',status:'pago'},l?clone(l):{});
  if(l.mov||l.vinculo){
    if(!l.mov)l.mov=S.emprestimos.some(e=>e.id===l.vinculo)?'emprestimo':'investimento';
    const alvo=l.mov==='investimento'?'investimentos':'emprestimos';
    openSheet('Lançamento automático',`<p class="small muted" style="margin:0">Este lançamento foi criado ${l.mov==='investimento'?'por um investimento':'por um empréstimo'} e é editado por lá.</p><div class="card">${lancRow(l)}</div><button class="btn primary" data-act="ir-fechar" data-v="${alvo}">Ir para ${l.mov==='investimento'?'Investimentos':'Empréstimos'}</button>`);
    return;
  }
  let st={tipo:l.tipo,natureza:l.natureza||'variavel'};
  const body=()=>`
   <div class="seg t-${st.tipo}" role="group" aria-label="Tipo">${[['despesa','Despesa'],['receita','Receita'],['transferencia','Transferência']].map(([k,t])=>`<button type="button" data-act="lf-tipo" data-v="${k}" aria-pressed="${st.tipo===k}">${t}</button>`).join('')}</div>
   <label class="money" for="lf-valor"><span>R$</span><input id="lf-valor" inputmode="decimal" placeholder="0,00" value="${moneyIn(l.valor)}" autofocus aria-label="Valor"></label>
   <div class="field"><label for="lf-desc">Descrição</label><input class="input" id="lf-desc" placeholder="${st.tipo==='receita'?'Ex.: salário da empresa':'Ex.: mercado do mês'}" value="${esc(l.descricao||'')}"></div>
   ${st.tipo!=='transferencia'?`<div class="field"><label for="lf-cat">Categoria</label><select class="input" id="lf-cat">${optsCats(st.tipo,l.tipo===st.tipo?l.categoriaId:null)}</select></div>`:''}
   <div class="two"><div class="field"><label for="lf-conta">${st.tipo==='transferencia'?'De':'Conta'}</label><select class="input" id="lf-conta">${optsContas(l.contaId,true)}</select></div>
   ${st.tipo==='transferencia'?`<div class="field"><label for="lf-dest">Para</label><select class="input" id="lf-dest">${optsContas(l.contaDestinoId||(contasAtivas()[1]||{}).id,true)}</select></div>`:`<div class="field"><label for="lf-data">Data</label><input class="input" type="date" id="lf-data" value="${l.data}"></div>`}</div>
   ${st.tipo==='transferencia'?`<div class="field"><label for="lf-data">Data</label><input class="input" type="date" id="lf-data" value="${l.data}"></div>`:''}
   ${st.tipo==='despesa'?`<div class="field"><span class="lbl">Natureza</span><div class="seg" role="group" aria-label="Natureza"><button type="button" data-act="lf-nat" data-v="variavel" aria-pressed="${st.natureza!=='fixo'}">Variável</button><button type="button" data-act="lf-nat" data-v="fixo" aria-pressed="${st.natureza==='fixo'}">Fixo</button></div></div>`:''}
   <label class="toggle" for="lf-pago"><span>${st.tipo==='receita'?'Já recebido':'Já pago'}</span><input type="checkbox" id="lf-pago" ${l.status==='pago'?'checked':''}></label>
   ${novo&&st.tipo!=='transferencia'?`<div class="two"><div class="field"><label for="lf-rep">Repetição</label><select class="input" id="lf-rep"><option value="nao">Não repetir</option><option value="mensal">Repetir todo mês</option>${st.tipo==='despesa'?'<option value="parcelar">Parcelar o valor</option>':''}</select></div><div class="field" id="lf-n-f" hidden><label for="lf-n">Quantas vezes</label><input class="input" id="lf-n" type="number" min="2" max="72" value="12" inputmode="numeric"></div></div><p class="xs muted" style="margin:-6px 0 0" id="lf-rep-hint">Repetir cria os próximos meses como pendentes. Parcelar divide o valor total.</p>`:''}
   ${l.grupoId&&!novo?`<p class="xs muted" style="margin:0">Faz parte de uma série${l.parcela?' ('+esc(l.parcela)+')':''}. Alterações valem só para este mês.</p>`:''}
   <div id="lf-err" class="small neg" role="alert"></div>
   <div class="actions">${!novo?`<button class="btn danger" data-act="lf-excluir">${ic('trash','sm')} Excluir</button>`:''}<button class="btn primary" data-act="lf-salvar">${novo?'Lançar':'Salvar'}</button></div>
   <div id="lf-confirm"></div>`;
  const keep=()=>{l.valor=parseMoney(val('lf-valor'))||0;l.descricao=val('lf-desc');if(document.getElementById('lf-cat'))l.categoriaId=val('lf-cat');l.contaId=val('lf-conta');if(document.getElementById('lf-dest'))l.contaDestinoId=val('lf-dest');l.data=val('lf-data')||l.data;l.status=document.getElementById('lf-pago').checked?'pago':'pendente'};
  const redraw=()=>{keep();$('#sheet-body').innerHTML=body()};
  openSheet(novo?'Novo lançamento':'Editar lançamento',body());
  sheetHandlers={
    'lf-tipo':v=>{st.tipo=v;redraw()},
    'lf-nat':v=>{st.natureza=v;redraw()},
    'lf-salvar':()=>{
      const valor=parseMoney(val('lf-valor'));
      if(!valor||valor<0||isNaN(valor)){$('#lf-err').textContent='Digite um valor maior que zero, por exemplo 45,90.';return}
      const data=val('lf-data'); if(!data){$('#lf-err').textContent='Escolha a data.';return}

      if(st.tipo==='transferencia'){o.contaDestinoId=val('lf-dest');o.categoriaId=null;o.natureza=null;if(o.contaDestinoId===o.contaId){$('#lf-err').textContent='Escolha contas diferentes para a transferência.';return}}

        partes.forEach((v,i)=>{const d=addMonths(data,i);put('lancamentos',Object.assign(clone(o),{id:uid(),valor:v,data:d,grupoId:g,parcela:rep==='parcelar'?`${i+1}/${n}`:null,natureza:st.tipo==='despesa'?(rep==='mensal'?'fixo':st.natureza):null,status:i===0?o.status:(d<=h&&o.status==='pago'?'pago':'pendente')}),true)});
        closeSheet();render();toast(rep==='parcelar'?`${n} parcelas lançadas`:`Lançado para os próximos ${n} meses`);return;
      }
      put('lancamentos',o,true);closeSheet();render();toast(novo?'Lançamento registrado':'Lançamento atualizado');
    },
    'lf-excluir':()=>{
      const futuros=l.grupoId?S.lancamentos.filter(x=>x.grupoId===l.grupoId&&x.data>l.data).length:0;
      $('#lf-confirm').innerHTML=`<div class="confirm"><b>Excluir este lançamento?</b><div class="actions"><button class="btn ghost sm" data-act="lf-del-cancel">Cancelar</button><button class="btn danger sm" data-act="lf-del-um">Excluir este</button>${futuros?`<button class="btn danger sm" data-act="lf-del-todos">Este e os ${futuros} próximos</button>`:''}</div></div>`;

    'lf-del-um':()=>{del('lancamentos',l.id,true);closeSheet();render();toast('Lançamento excluído')},
    'lf-del-todos':()=>{S.lancamentos.filter(x=>x.grupoId===l.grupoId&&x.data>=l.data).forEach(x=>del('lancamentos',x.id,true));closeSheet();render();toast('Lançamentos excluídos')}
  };
}

/* Pagamento extra, amortização e quitação antecipada.
   Com juros, cada parcela em aberto vale hoje o seu valor presente: valor / (1 + taxa)^meses até o vencimento.
   É a regra do Código de Defesa do Consumidor (art. 52, § 2º): quem antecipa paga sem os juros do tempo que falta. */
const mesesAte=(de,ate)=>Math.max(0,(Date.parse(ate)-Date.parse(de))/DIA/30);
function vpParcela(e,p,d){const i=(e.taxa||0)/100;if(!i)return p.valor;return Math.round(p.valor/Math.pow(1+i,mesesAte(d,p.venc)))}
const porVenc=(a,b)=>a.venc<b.venc?-1:a.venc>b.venc?1:a.n-b.n;
function quitacao(e,d){const ab=(e.parcelas||[]).filter(p=>!p.pagoEm);const vp=sum(ab,p=>vpParcela(e,p,d)),nominal=sum(ab,p=>p.valor);return {vp,nominal,desconto:Math.max(0,nominal-vp),n:ab.length}}
function simularAmort(e,V,modo,d){
  const ps=clone(e.parcelas||[]); const i=(e.taxa||0)/100;
  const ab=ps.filter(p=>!p.pagoEm).sort(porVenc); if(!ab.length||!(V>0))return null;
  const q=quitacao(e,d); const r={ps,modo,quita:false,eliminadas:0,abatida:null,parcelaAntes:null,parcelaDepois:null,usado:V};
  const marcar=p=>{p.valorPago=vpParcela(e,p,d);p.pagoEm=d;p.antecipada=true};
  const fut=ab.filter(p=>p.venc>=d), vpFut=sum(fut,p=>vpParcela(e,p,d));
  if(V>=q.vp){ab.forEach(marcar);r.quita=true;r.modo='quitacao';r.usado=q.vp;r.eliminadas=ab.length}
  else if(modo==='parcela'&&fut.length&&V<vpFut){
    /* reduzir a parcela: o saldo que sobra é refinanciado nas mesmas datas, com a mesma taxa */
    const novo=vpFut-V; r.parcelaAntes=fut[0].valor;
    if(i){const fator=sum(fut,p=>1/Math.pow(1+i,mesesAte(d,p.venc)));const c=Math.round(novo/fator);fut.forEach(p=>{if(p.valorOriginal==null)p.valorOriginal=p.valor;p.valor=c})}
    else{const b=Math.floor(novo/fut.length);fut.forEach((p,k)=>{if(p.valorOriginal==null)p.valorOriginal=p.valor;p.valor=k===fut.length-1?novo-b*(fut.length-1):b})}
    r.parcelaDepois=fut[0].valor;
  }else{
    /* reduzir o prazo: o valor quita as últimas parcelas pelo valor presente; o que sobra abate a parcela seguinte */
    r.modo='prazo'; let rem=V;
    for(const p of ab.slice().reverse()){
      const vp=vpParcela(e,p,d);
      if(rem>=vp){marcar(p);rem-=vp;r.eliminadas++;continue}
      if(rem>0){const f=i?Math.pow(1+i,mesesAte(d,p.venc)):1;if(p.valorOriginal==null)p.valorOriginal=p.valor;p.valor=Math.max(1,p.valor-Math.round(rem*f));r.abatida=p}
      break;
    }
  }

  r.restantes=rest.length; r.fim=rest.length?rest[rest.length-1].venc:null;
  return r;
}

/* Conta, categoria, pessoa */
/* Contas e cartões: dados bancários, Pix e dados do cartão (só os 4 últimos números) */
const BANDEIRAS=['Visa','Mastercard','Elo','American Express','Hipercard','Outra'];
const PIX={cpf:'CPF',cnpj:'CNPJ',email:'E-mail',telefone:'Telefone',aleatoria:'Chave aleatória'};
function proxDia(dia){
  dia=Number(dia); if(!dia)return null; const h=hoje(); const [y,m]=h.split('-').map(Number);
  const em=(yy,mm)=>isoOf(yy,mm,Math.min(dia,new Date(yy,mm,0).getDate()));
  let d=em(y,m); if(d<h){const n=addMonths(isoOf(y,m,1),1).split('-').map(Number);d=em(n[0],n[1])} return d;
}
const contaIco=c=>c.tipo==='cartao'?'card':c.tipo==='carteira'?'wallet':c.tipo==='poupanca'?'piggy':'bank';
function contaSub(c){
  if(c.tipo==='cartao')return [c.bandeira,c.final?'•••• '+c.final:'',c.vencimento?'vence dia '+c.vencimento:''].filter(Boolean).join(' · ')||TIPO_CONTA.cartao;
  return [c.instituicao||TIPO_CONTA[c.tipo],c.agencia?'Ag. '+c.agencia:'',c.numero?'Conta '+c.numero:''].filter(Boolean).join(' · ');
}
const fatura=c=>Math.max(0,-saldoConta(c.id));
function dadosConta(c){
  const L=[];const a=(k,v)=>{if(v)L.push([k,v])};
  if(c.tipo==='cartao'){a('Emissor',c.instituicao);a('Bandeira',c.bandeira);a('Final',c.final?'•••• '+c.final:'');a('Limite',c.limite?brl(c.limite):'');a('Fecha dia',c.fechamento);a('Vence dia',c.vencimento);a('Paga com',c.contaPagamentoId&&(conta(c.contaPagamentoId)||{}).nome)}
  else{a('Banco',c.instituicao);a('Agência',c.agencia);a('Conta',c.numero);a('Titular',c.titular);a('Pix'+(c.pixTipo?' ('+PIX[c.pixTipo]+')':''),c.pixChave)}
  return L;
}
function vContas(){
  const todas=S.contas.slice().sort((a,b)=>(a.ativa===false)-(b.ativa===false));
  const contas=todas.filter(c=>c.tipo!=='cartao'), cartoes=todas.filter(c=>c.tipo==='cartao');
  const ativ=c=>c.ativa!==false;
  const tot=sum(contas.filter(ativ),c=>saldoConta(c.id)), fat=sum(cartoes.filter(ativ),fatura);
  const row=c=>{const s=saldoConta(c.id);const lim=c.tipo==='cartao'&&c.limite?Math.max(0,c.limite-fatura(c)):null;
    return `<div class="row" data-act="abrir-conta" data-id="${c.id}" role="button" tabindex="0"><span class="cat-ico" style="background:var(--surface-2);color:var(--ink)">${ic(contaIco(c))}</span><div class="row-main"><b>${esc(c.nome)}</b><span>${esc(contaSub(c))}${c.ativa===false?' · Arquivada':''}</span></div><div class="row-end"><b class="${s<0?'neg':''}">${brlS(s)}</b>${c.tipo==='cartao'?`<span class="xs muted">${lim!=null?(ocSaldo?'limite disponível':brl(lim)+' disponível'):s<0?'fatura em aberto':'sem fatura'}</span>`:''}</div></div>`};
  return `${voltar()}
  <div class="grid2"><div class="card stat"><span class="eyebrow">Em contas</span><b>${brlS(tot)}</b><span class="xs muted">${contas.filter(ativ).length} conta(s) ativa(s)</span></div>
   <div class="card stat"><span class="eyebrow">Faturas abertas</span><b class="${fat?'neg':''}">${brlS(fat)}</b><span class="xs muted">${cartoes.filter(ativ).length} cartão(ões)</span></div></div>
  <div style="display:flex;gap:8px;align-items:center"><button class="btn primary" data-act="nova-conta" style="flex:1">${ic('plus')} Nova conta ou cartão</button>${olho('saldo')}</div>
  <section class="card" style="padding-block:10px 4px"><div class="eyebrow">Contas</div><div class="list">${contas.map(row).join('')||'<p class="small muted">Nenhuma conta.</p>'}</div></section>
  <section class="card" style="padding-block:10px 4px"><div class="eyebrow">Cartões de crédito</div>${cartoes.length?`<div class="list">${cartoes.map(row).join('')}</div>`:`<p class="small muted" style="margin:6px 0 10px">Cadastre seus cartões com limite, fechamento e vencimento para acompanhar a fatura.</p>`}</section>`;
}
function detalheConta(id){
  const c=conta(id); if(!c)return closeSheet();
  const s=saldoConta(id), cart=c.tipo==='cartao', f=fatura(c), dados=dadosConta(c);

   <div class="actions">${temBanco?`<button class="btn ghost" data-act="ct-copiar">${ic('receipt','sm')} Copiar dados</button>`:''}<button class="btn ghost" data-act="ct-extrato">${ic('file','sm')} Extrato</button></div>
   <button class="btn ghost" data-act="ct-editar">${ic('edit','sm')} Editar</button>`);
  sheetHandlers={

      formLanc({tipo:'transferencia',valor:f,contaId:pg,contaDestinoId:id,descricao:'Pagamento da fatura '+c.nome,data:hoje(),status:'pago'})},
    'ct-copiar':()=>{const t=[c.nome].concat(dados.map(([k,v])=>k+': '+v)).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Dados copiados')).catch(()=>toast('Não foi possível copiar'));else toast('Não foi possível copiar')}
  };
}

function saldoContaAte(id,ate){const c=conta(id);let s=c?(c.saldoInicial||0):0;for(const l of S.lancamentos){if(l.status!=='pago'||!l.data||l.data>ate)continue;
  if(l.tipo==='receita'&&l.contaId===id)s+=l.valor;else if(l.tipo==='despesa'&&l.contaId===id)s-=l.valor;else if(l.tipo==='transferencia'){if(l.contaId===id)s-=l.valor;if(l.contaDestinoId===id)s+=l.valor}}return s}
function extratoDados(f){
  let ls=S.lancamentos.filter(l=>l.data&&l.data>=f.de&&l.data<=f.ate);
  if(f.tipo!=='todos')ls=ls.filter(l=>l.tipo===f.tipo);
  if(f.situacao==='pago')ls=ls.filter(l=>l.status==='pago');else if(f.situacao==='pendente')ls=ls.filter(l=>l.status!=='pago');
  if(f.contaId)ls=ls.filter(l=>l.contaId===f.contaId||l.contaDestinoId===f.contaId);
  if(f.categoriaId)ls=ls.filter(l=>l.categoriaId===f.categoriaId);
  ls.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.criadoEm||0)-(b.criadoEm||0));
  /* com uma conta escolhida, transferências entram ou saem; sem conta, só receitas e despesas contam */
  const sinal=l=>f.contaId?(l.tipo==='receita'||(l.tipo==='transferencia'&&l.contaDestinoId===f.contaId)?1:-1):(l.tipo==='receita'?1:l.tipo==='despesa'?-1:0);

  const comSaldo=!!f.contaId&&f.tipo==='todos'&&!f.categoriaId&&f.situacao!=='pendente';
  const pg=ls.filter(l=>l.status==='pago'), pend=ls.filter(l=>l.status!=='pago');
  return {ls,sinal,ent,sai,comSaldo,pend,entP:sum(pg.filter(l=>sinal(l)>0),l=>l.valor),saiP:sum(pg.filter(l=>sinal(l)<0),l=>l.valor),

}

const pausaLivre=ms=>{pausaLivreAte=Date.now()+(ms||120000)};
const emPausaLivre=()=>Date.now()<pausaLivreAte;
/* Volta da leitura da digital: a primeira volta ao app, logo depois de confirmar, não bloqueia */
let voltaBioAte=0;
const voltaBio=()=>{if(Date.now()<voltaBioAte){voltaBioAte=0;return true}return false};
let esqueci=null; /* null = teclado do PIN; 'menu' | 'codigo' | 'pergunta' | 'apagar' = recuperação */
let lockManual=false; /* bloqueado pelo cadeado: não pede a digital sozinho */
const bioAuto=()=>lsGet('md_bio_auto')!=='0';
function bloquear(manual){if(!temPin())return;closeSheet();lockState='locked';pinBuf='';bioPedido=false;esqueci=null;pausaLivreAte=0;lockManual=!!manual;renderLock()}
/* A leitura da digital abre uma tela do sistema por cima do app (no Android, outra Activity).
   Sem a pausa livre, ao voltar o app achava que tinha saído e bloqueava de novo, pedindo a digital sem parar. */
let bioLendo=false;
function bioTentar(auto){
  if(bioLendo)return; bioLendo=true; pausaLivre();
  const msg=(c,t)=>{const m=$('#pin-msg');if(m){m.className='pin-msg '+c;m.textContent=t}};
  msg('muted','Toque no leitor de digital…');
  bioEntrar().then(ok=>{bioLendo=false;if(ok){voltaBioAte=Date.now()+3000;desbloquear()}else msg('neg','Digital não confirmada. Tente de novo ou use o PIN.')})
   .catch(err=>{bioLendo=false;if(auto&&!NATIVE&&err&&err.name==='NotAllowedError')msg('muted','Toque em Entrar com a digital ou digite o PIN.');else msg('neg',bioErro(err)+' Use o PIN.')});
}
function desbloquear(){lockState='open';pinBuf='';esqueci=null;lockManual=false;lsDel('md_tent');lastActivity=Date.now();pausaLivreAte=0;renderLock()}
function registrarErro(){const t=tentativas();t.n++;if(t.n>=5)t.ate=Date.now()+Math.min(15*60000,30000*Math.pow(2,t.n-5));lsSet('md_tent',JSON.stringify(t));return t}
const temCodigo=()=>!!(SEG&&SEG.rec&&SEG.rec.hash), temPergunta=()=>!!(SEG&&SEG.perg&&SEG.perg.hash);
function telaEsqueci(bio,espera){
  const msg=`<div class="pin-msg ${espera?'neg':'muted'}" id="pin-msg" role="status">${espera?`Muitas tentativas. Aguarde ${espera}s.`:''}</div>`;
  if(esqueci==='menu'){
    const op=(act,icn,t,sub,estilo,livre)=>`<button class="row" data-act="${act}" ${espera&&!livre?'disabled':''}><span class="cat-ico" style="${estilo||''}">${ic(icn)}</span><span class="row-main"><b>${t}</b><span>${sub}</span></span>${ic('chevR')}</button>`;
    const nada=!bio&&!temCodigo()&&!temPergunta();
    return `<p class="small muted" style="margin:0">Prove que é você para criar um PIN novo. Seus dados continuam salvos.</p>
     <div class="menu">${bio?op('rc-bio','finger','Usar a digital','Confirme com a digital deste aparelho'):''}
      ${temCodigo()?op('rc-ir-codigo','key','Código de recuperação','O código de 12 letras e números que você guardou'):''}
      ${temPergunta()?op('rc-ir-pergunta','help','Pergunta de segurança',esc(SEG.perg.texto)):''}
      ${op('rc-ir-apagar','trash','Apagar tudo e começar de novo','Última opção: depois dá para restaurar um backup','background:var(--neg-soft);color:var(--neg)',true)}</div>
     ${nada?`<div class="banner">${ic('alert')}<div>Não há digital, código nem pergunta de recuperação configurados. Sem o PIN, a saída é apagar os dados do app e restaurar um backup.</div></div>`:''}
     ${msg}<button class="btn ghost" data-act="rc-voltar">Voltar para o PIN</button>`;
  }
  if(esqueci==='codigo'||esqueci==='pergunta'){
    const cod=esqueci==='codigo';
    return `<p class="small" style="margin:0">${cod?'Digite o código de recuperação que você guardou ao criar o PIN.':'<b>'+esc(SEG.perg.texto)+'</b>'}</p>
     <input class="input${cod?' codefield':''}" id="rc-input" autocomplete="off" autocorrect="off" spellcheck="false" ${cod?'autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" aria-label="Código de recuperação"':'placeholder="Sua resposta" aria-label="Resposta"'} ${espera?'disabled':''}>
     ${msg}<div class="actions"><button class="btn ghost" data-act="rc-menu">Voltar</button><button class="btn primary" data-act="rc-confirmar" ${espera?'disabled':''}>Confirmar</button></div>`;
  }
  return `<p class="small" style="margin:0"><b>Isto apaga todos os lançamentos, contas, empréstimos e investimentos ${mode==='db'?'da sua conta':'deste aparelho'}</b> e tira o PIN. Se você tem um arquivo de backup, poderá restaurá-lo depois em Mais › Backup.</p>
   <p class="small muted" style="margin:0">Para confirmar, digite <b>APAGAR</b>.</p>
   <input class="input" id="rc-input" autocomplete="off" autocapitalize="characters" placeholder="APAGAR" aria-label="Digite APAGAR">
   <div id="rc-err" class="small neg" role="alert"></div>
   <div class="actions"><button class="btn ghost" data-act="rc-menu">Voltar</button><button class="btn danger" data-act="rc-apagar">Apagar tudo</button></div>`;
}
function renderLock(){
  const root=$('#lock-root'); clearInterval(lockTick);
  const main=$('#view'); if(main){if(lockState==='open')main.removeAttribute('inert');else main.setAttribute('inert','')}
  atualizarLockBtn();
  if(lockState==='open'){const tinha=root.innerHTML!=='';root.innerHTML='';if(tinha)render();return}
  if(lockState==='checking')return;
  if(main)main.innerHTML='';
  const t=tentativas(); const espera=Math.max(0,Math.ceil((t.ate-Date.now())/1000));
  const bio=!!(bioRegistrada()&&bioOk);
  if(esqueci==='codigo'&&!temCodigo()||esqueci==='pergunta'&&!temPergunta())esqueci='menu';
  const titulo={menu:'Esqueci o PIN',codigo:'Código de recuperação',pergunta:'Pergunta de segurança',apagar:'Apagar e recomeçar'}[esqueci]||(bio?'Desbloqueie o app':'Digite seu PIN');
  const head=`<div class="lock-head"><span class="brand-mark">${ic('trend')}</span><h1>${titulo}</h1><span class="small muted">Meu Dinheiro está bloqueado</span></div>`;
  if(espera)lockTick=setInterval(()=>{if(Date.now()>=tentativas().ate){renderLock()}else{const m=$('#pin-msg');if(m)m.textContent=`Muitas tentativas. Aguarde ${Math.ceil((tentativas().ate-Date.now())/1000)}s.`}},1000);
  if(esqueci){
    root.innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-label="${titulo}">${head}<div class="card lock-opts">${telaEsqueci(bio,espera)}</div></div>`;
    setTimeout(()=>{const i=$('#rc-input');if(i&&!i.disabled)i.focus()},50);return;
  }
  const n=SEG.pinLen||4;
  const k=d=>`<button class="key" data-act="pin-key" data-v="${d}" ${espera?'disabled':''} aria-label="${d}">${d}</button>`;
  root.innerHTML=`<div class="lock" role="dialog" aria-modal="true" aria-label="Desbloquear">${head}
   ${bio?`<button class="bio-btn" data-act="pin-bio" ${espera?'disabled':''}>${ic('finger')}<span>Entrar com a digital</span></button><span class="xs muted" style="margin-top:-10px">ou digite seu PIN</span>`:''}
   <div class="pin-dots" id="pin-dots" aria-label="${pinBuf.length} de ${n} dígitos">${Array.from({length:n},(_,i)=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
   <div class="pin-msg ${espera?'neg':'muted'}" id="pin-msg" role="status">${espera?`Muitas tentativas. Aguarde ${espera}s.`:(t.n?`PIN incorreto. ${Math.max(0,5-t.n)} tentativa(s) antes de uma pausa.`:'')}</div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k).join('')}
    <span></span>
    ${k(0)}<button class="key flat" data-act="pin-back" aria-label="Apagar">${ic('backspace')}</button></div>
   <button class="linkbtn" data-act="pin-esqueci">Esqueci o PIN</button></div>`;
  /* Digital disponível: pede sozinha ao abrir e ao voltar para o app (não quando você bloqueou pelo cadeado) */
  if(bio&&!espera&&!bioPedido&&!lockManual&&bioAuto()){bioPedido=true;setTimeout(()=>{if(lockState==='locked'&&!esqueci)bioTentar(true)},250)}
}
function pintarDots(err){const d=$('#pin-dots');if(!d)return;[...d.children].forEach((c,i)=>c.classList.toggle('on',i<pinBuf.length));d.setAttribute('aria-label',pinBuf.length+' dígitos');if(err){d.classList.remove('err');void d.offsetWidth;d.classList.add('err')}}
let verificando=false;
async function pinTecla(dg){
  if(verificando||lockState!=='locked'||esqueci||Date.now()<tentativas().ate)return;
  const n=SEG.pinLen||4; if(pinBuf.length>=n)return;
  pinBuf+=dg; pintarDots();
  if(pinBuf.length<n)return;
  verificando=true;
  let ok=false; try{ok=(await hashPin(pinBuf,SEG.pinSalt))===SEG.pinHash}catch(e){}
  verificando=false;
  if(ok){desbloquear();return}
  registrarErro(); pinBuf=''; renderLock(); pintarDots(true);
}
function pinApagar(){if(lockState!=='locked'||esqueci)return;pinBuf=pinBuf.slice(0,-1);pintarDots()}
const pinValido=p=>/^\d{4,6}$/.test(p);
const pinFraco=p=>/^(\d)\1+$/.test(p)||'0123456789'.includes(p)||'9876543210'.includes(p);
async function novoPinDados(p){const salt=uid();return Object.assign({},SEG||{},{pinHash:await hashPin(p,salt),pinSalt:salt,pinLen:p.length,autoLock:SEG&&SEG.autoLock!=null?SEG.autoLock:0,atualizadoEm:Date.now()})}
async function confere(p){try{return temPin()&&pinValido(p)&&(await hashPin(p,SEG.pinSalt))===SEG.pinHash}catch(e){return false}}

/* Recuperação do PIN: código de 12 caracteres e pergunta de segurança, guardados só como hash (PBKDF2) */
const ALFA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; /* sem 0/O e 1/I para não confundir */
function gerarCodigo(){const r=crypto.getRandomValues(new Uint8Array(12));return Array.from(r,x=>ALFA[x%32]).join('').match(/.{4}/g).join('-')}
const normCod=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const normResp=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
async function segredoDados(texto){const salt=uid();return {hash:await hashPin(texto,salt),salt,em:Date.now()}}
async function rcConfirmar(){
  if(verificando||Date.now()<tentativas().ate)return;
  const v=val('rc-input'); if(!v.trim())return;
  const via=esqueci; verificando=true; let ok=false;
  try{ok=via==='codigo'?(await hashPin(normCod(v),SEG.rec.salt))===SEG.rec.hash:(await hashPin(normResp(v),SEG.perg.salt))===SEG.perg.hash}catch(e){}
  verificando=false;
  if(ok){desbloquear();formNovoPin(via);return}
  const t=registrarErro(); renderLock();
  const m=$('#pin-msg'); if(m&&Date.now()>=t.ate){m.className='pin-msg neg';m.textContent=(via==='codigo'?'Código incorreto.':'Resposta incorreta.')+` ${Math.max(0,5-t.n)} tentativa(s) antes de uma pausa.`}
}
function rcBio(){const m=$('#pin-msg');if(m){m.className='pin-msg muted';m.textContent='Toque no leitor de digital…'}pausaLivre();
  bioEntrar().then(ok=>{if(ok){voltaBioAte=Date.now()+3000;desbloquear();formNovoPin('bio')}else{const mm=$('#pin-msg');if(mm){mm.className='pin-msg neg';mm.textContent='Digital não confirmada.'}}}).catch(err=>{const mm=$('#pin-msg');if(mm){mm.className='pin-msg neg';mm.textContent=bioErro(err)}})}
function apagarTudo(){
  if(val('rc-input').trim().toUpperCase()!=='APAGAR'){const e=$('#rc-err');if(e)e.textContent='Digite APAGAR para confirmar.';return}
  restaurarFabrica();desbloquear();render();
  toast('Dados apagados. Para recuperar, restaure um backup em Mais › Backup.');
}

const pinIn=(id,l)=>`<div class="field"><label for="${id}">${l}</label><input class="input pinfield" id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off"></div>`;
const segErr=(m,id)=>{const e=$('#'+(id||'sg-err'));if(e)e.textContent=m};
function checarNovo(){const a=val('sg-novo'),b=val('sg-conf');if(!pinValido(a)){segErr('O PIN precisa ter de 4 a 6 números.');return null}if(pinFraco(a)){segErr('Evite PIN fácil como 1234 ou 0000.');return null}if(a!==b){segErr('Os dois PINs não são iguais.');return null}return a}
function mostrarCodigo(cod,aviso){
  openSheet('Código de recuperação',`${aviso?`<div class="banner info">${ic('check')}<div>${esc(aviso)}</div></div>`:''}
   <p class="small" style="margin:0">Se esquecer o PIN, este código libera o app para você criar um PIN novo. <b>Ele aparece só agora.</b> Anote num papel ou num gerenciador de senhas, fora deste celular.</p>
   <div class="code" id="rc-codigo">${cod}</div>
   <button class="btn ghost" data-act="cod-copiar">Copiar código</button>
   <button class="btn primary" data-act="cod-ok">Já guardei o código</button>`);
  sheetHandlers={
    'cod-copiar':()=>{const ok=()=>toast('Código copiado');if(navigator.clipboard)navigator.clipboard.writeText(cod).then(ok).catch(()=>toast('Selecione o código e copie'));else toast('Selecione o código e copie')},
    'cod-ok':()=>formSeguranca()
  };
}
/* Depois de provar quem é (digital, código ou pergunta), cria um PIN novo sem pedir o antigo */
function formNovoPin(via){
  const como={bio:'Digital confirmada.',codigo:'Código confirmado.',pergunta:'Resposta confirmada.'}[via];
  openSheet('Criar um PIN novo',`<div class="banner info">${ic('shield')}<div>${como} Agora crie um PIN novo.${via==='codigo'?' O código usado deixa de valer e você recebe outro.':''}</div></div>
   ${pinIn('sg-novo','Novo PIN')}${pinIn('sg-conf','Repita o novo PIN')}
   <div id="sg-err" class="small neg" role="alert"></div><button class="btn primary" data-act="sg-redef">${ic('lock')} Salvar novo PIN</button>`);
  setTimeout(()=>{const i=$('#sg-novo');if(i)i.focus()},80);
  sheetHandlers={'sg-redef':async()=>{const p=checarNovo();if(!p)return;const d=await novoPinDados(p);let cod=null;if(via==='codigo'){cod=gerarCodigo();d.rec=await segredoDados(normCod(cod))}
    segSalvar(d);lastActivity=Date.now();if(cod)mostrarCodigo(cod,'PIN novo salvo. Guarde o novo código.');else{closeSheet();toast('PIN novo salvo')}}};
}

function formSeguranca(){
  const bio=bioRegistrada();
  const PERGS=['Qual o nome do seu primeiro animal de estimação?','Em que cidade sua mãe nasceu?','Qual o nome da sua primeira escola?','Qual o apelido que você tinha na infância?','Qual o nome do seu melhor amigo de infância?'];
  const card=(t,c)=>`<section class="card" style="display:flex;flex-direction:column;gap:10px"><b>${t}</b>${c}</section>`;
  const body=!temPin()?`
   <p class="small muted" style="margin:0">Com o PIN, o app pede uma senha de 4 a 6 números sempre que for aberto. Você também recebe um código de recuperação para o caso de esquecer o PIN.</p>
   ${pinIn('sg-novo','Novo PIN')}${pinIn('sg-conf','Repita o PIN')}
   <div id="sg-err" class="small neg" role="alert"></div>
   <button class="btn primary" data-act="sg-criar">${ic('lock')} Criar PIN</button>`
  :`<div class="banner info">${ic('shield')}<div>PIN ativo. O app pede o PIN ao abrir${bio?' e aceita a digital neste aparelho':''}.</div></div>
   ${!temCodigo()&&!temPergunta()&&!bio?`<div class="banner">${ic('alert')}<div>Configure uma forma de recuperação abaixo. Sem ela, esquecer o PIN obriga a apagar os dados.</div></div>`:''}
   <div class="field"><label for="sg-auto">Bloquear automaticamente</label><select class="input" id="sg-auto">${[[0,'Ao sair do app'],[1,'Após 1 minuto sem uso'],[5,'Após 5 minutos sem uso'],[15,'Após 15 minutos sem uso']].map(([v,l])=>`<option value="${v}" ${Number(SEG.autoLock||0)===v?'selected':''}>${l}</option>`).join('')}</select></div>
   ${card('Digital',`${bio?`<p class="small muted" style="margin:0">Ativa neste aparelho. Também serve para criar um PIN novo se você esquecer o atual. Em outros aparelhos, ative de novo por lá.</p><label class="toggle" for="sg-bio-auto"><span>Pedir a digital assim que o app abrir</span><input type="checkbox" id="sg-bio-auto" ${bioAuto()?'checked':''}></label><button class="btn ghost" data-act="sg-bio-off">Desativar digital neste aparelho</button>`
    :bioOk?`<p class="small muted" style="margin:0">Use a digital ou o reconhecimento facial do aparelho para desbloquear sem digitar o PIN.</p>${pinIn('sg-bio-pin','PIN atual')}<button class="btn primary" data-act="sg-bio-on">${ic('finger')} Ativar digital neste aparelho</button>`
    :`<p class="small muted" style="margin:0">Este aparelho ou navegador não libera a digital para esta página. Continue usando o PIN.</p>`}
    <div id="sg-bio-msg" class="small" role="status"></div>`)}
   ${card('Se esquecer o PIN',`<p class="small muted" style="margin:0">Na tela de bloqueio, toque em <b>Esqueci o PIN</b> e use uma destas opções. Para mudar qualquer uma, confirme com o PIN atual.</p>
    ${pinIn('sg-rpin','PIN atual')}
    <div class="inst"><span class="cat-ico" style="width:34px;height:34px;background:var(--surface-2)">${ic('key','sm')}</span><div class="row-main"><b>Código de recuperação</b><span>${temCodigo()?'Criado em '+esc(dataHora(SEG.rec.em).slice(0,10)):'Não criado'}</span></div><button class="btn sm ${temCodigo()?'ghost':'primary'}" data-act="sg-cod">${temCodigo()?'Gerar outro':'Criar'}</button></div>
    <div class="inst"><span class="cat-ico" style="width:34px;height:34px;background:var(--surface-2)">${ic('help','sm')}</span><div class="row-main"><b>Pergunta de segurança</b><span>${temPergunta()?esc(SEG.perg.texto):'Não definida'}</span></div>${temPergunta()?'<button class="btn sm ghost" data-act="sg-perg-del">Remover</button>':''}</div>
    <div class="field"><label for="sg-perg">${temPergunta()?'Trocar a pergunta':'Pergunta'}</label><input class="input" id="sg-perg" list="sg-pergs" placeholder="Escolha ou escreva uma pergunta"><datalist id="sg-pergs">${PERGS.map(q=>`<option value="${esc(q)}">`).join('')}</datalist></div>
    <div class="field"><label for="sg-resp">Resposta</label><input class="input" id="sg-resp" autocomplete="off" autocorrect="off" spellcheck="false"><span class="xs muted">Escolha uma resposta que só você sabe e que não está nas redes sociais. Maiúsculas e acentos não importam.</span></div>
    <button class="btn ghost" data-act="sg-perg-salvar">Salvar pergunta</button>
    <div id="sg-rec-err" class="small neg" role="alert"></div>`)}
   ${card('Alterar PIN',`${pinIn('sg-atual','PIN atual')}${pinIn('sg-novo','Novo PIN')}${pinIn('sg-conf','Repita o novo PIN')}
    <div id="sg-err" class="small neg" role="alert"></div><button class="btn primary" data-act="sg-alterar">Salvar novo PIN</button>`)}
   ${card('Tirar o PIN',`${pinIn('sg-rem','PIN atual')}
    <div id="sg-rem-err" class="small neg" role="alert"></div><button class="btn danger" data-act="sg-remover">Tirar o PIN e a digital</button>`)}`;
  openSheet('Segurança',body);
  const err=segErr;
  const pinRec=async()=>{if(!(await confere(val('sg-rpin')))){err('Digite o PIN atual para confirmar.','sg-rec-err');return false}return true};
  sheetHandlers={
    'sg-criar':async()=>{const p=checarNovo();if(!p)return;const cod=gerarCodigo();try{const d=await novoPinDados(p);d.rec=await segredoDados(normCod(cod));segSalvar(d)}catch(e){return err('Este navegador não permite criar PIN aqui.')}lastActivity=Date.now();mostrarCodigo(cod,'PIN criado.')},
    'sg-alterar':async()=>{if(!(await confere(val('sg-atual'))))return err('PIN atual incorreto.');const p=checarNovo();if(!p)return;segSalvar(await novoPinDados(p));formSeguranca();toast('PIN alterado')},
    'sg-remover':async()=>{if(!(await confere(val('sg-rem'))))return err('PIN atual incorreto.','sg-rem-err');segSalvar(null);lsDel('md_bio');closeSheet();toast('PIN removido')},
    'sg-cod':async()=>{if(!(await pinRec()))return;const cod=gerarCodigo();segSalvar(Object.assign({},SEG,{rec:await segredoDados(normCod(cod)),atualizadoEm:Date.now()}));mostrarCodigo(cod,'Código novo criado. O anterior deixou de valer.')},
    'sg-perg-salvar':async()=>{const q=val('sg-perg').trim(),r=normResp(val('sg-resp'));if(q.length<5)return err('Escreva ou escolha uma pergunta.','sg-rec-err');if(r.length<3)return err('A resposta precisa ter pelo menos 3 letras.','sg-rec-err');if(!(await pinRec()))return;
      segSalvar(Object.assign({},SEG,{perg:Object.assign({texto:q},await segredoDados(r)),atualizadoEm:Date.now()}));formSeguranca();toast('Pergunta de segurança salva')},
    'sg-perg-del':async()=>{if(!(await pinRec()))return;const d=Object.assign({},SEG,{atualizadoEm:Date.now()});delete d.perg;segSalvar(d);formSeguranca();toast('Pergunta removida')},
    'sg-bio-on':async()=>{const m=$('#sg-bio-msg');if(!(await confere(val('sg-bio-pin')))){m.className='small neg';m.textContent='Digite o PIN atual para ativar a digital.';return}m.className='small muted';m.textContent='Siga as instruções do aparelho…';pausaLivre();try{await bioAtivar();formSeguranca();toast('Digital ativada')}catch(e){m.className='small neg';m.textContent=bioErro(e)}},
    'sg-bio-off':()=>{lsDel('md_bio');formSeguranca();toast('Digital desativada neste aparelho')}
  };
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return;
  const a=t.dataset.act, v=t.dataset.v, id=t.dataset.id;
  if(lockState!=='open'){
    if(lockState!=='locked')return;
    if(a==='pin-key')pinTecla(v);
    else if(a==='pin-back')pinApagar();
    else if(a==='pin-bio')bioTentar(false);
    else if(a==='pin-esqueci'||a==='rc-menu'){esqueci='menu';renderLock()}
    else if(a==='rc-voltar'){esqueci=null;pinBuf='';renderLock()}
    else if(a==='rc-ir-codigo'){esqueci='codigo';renderLock()}
    else if(a==='rc-ir-pergunta'){esqueci='pergunta';renderLock()}
    else if(a==='rc-ir-apagar'){esqueci='apagar';renderLock()}
    else if(a==='rc-confirmar')rcConfirmar();
    else if(a==='rc-bio')rcBio();
    else if(a==='rc-apagar')apagarTudo();
    return;
  }
  if(a==='fechar-bg'&&e.target!==t)return;
  if(sheetHandlers[a]){e.preventDefault();sheetHandlers[a](v!==undefined?v:t.dataset.n);return}
  switch(a){
    case 'ir': UI.view=v; if(t.dataset.aba)UI.empAba=t.dataset.aba; render(); window.scrollTo(0,0); break;
    case 'ir-fechar': closeSheet(); UI.view=v; render(); break;
    case 'novo-lanc': formLanc(); break;
    case 'abrir-lanc': formLanc(S.lancamentos.find(l=>l.id===id)); break;
    case 'toggle-pago': {e.stopPropagation(); const l=S.lancamentos.find(x=>x.id===id); if(!l)break; if(l.vinculo){formLanc(l);break} const n=clone(l); n.status=l.status==='pago'?'pendente':'pago'; put('lancamentos',n); toast(n.status==='pago'?'Marcado como pago':'Marcado como pendente'); break}
    case 'mes-ant': UI.mes=addMonths(UI.mes+'-01',-1).slice(0,7); render(); break;
    case 'mes-prox': UI.mes=addMonths(UI.mes+'-01',1).slice(0,7); render(); break;
    case 'tema': cycleTheme(); break;
    case 'bloquear': bloquear(true); break;
    case 'instalar': {const ev=window.__mdInstall; if(!ev)break; ev.prompt(); (ev.userChoice||Promise.resolve({})).then(r=>{if(r.outcome==='accepted'){window.__mdInstalled=true;toast('App instalado')}window.__mdInstall=null;render()}); break}
    case 'abrir-seg': formSeguranca(); break;
    case 'fabrica': formFabrica(); break;
    case 'extrato': formExtrato(); break;
    case 'set-tema': tema=v; lsSet('md_tema',tema); applyTheme(); render(); break;
    case 'filtro': UI.filtro=v; render(); break;
    case 'emp-aba': UI.empAba=v; render(); break;
    case 'novo-emp': formEmp(UI.empAba); break;
    case 'abrir-emp': detalheEmp(id); break;
    case 'novo-inv': formInv(); break;
    case 'abrir-inv': detalheInv(id); break;
    case 'nova-conta': formConta(); break; case 'abrir-conta': detalheConta(id); break;
    case 'nova-cat': formCat(); break; case 'abrir-cat': formCat(id); break;
    case 'nova-pessoa': formPessoa(); break; case 'abrir-pessoa': formPessoa(id); break;
    case 'fechar': case 'fechar-bg': closeSheet(); break;
    case 'carregar-exemplo': carregarExemplo(); break;
    case 'apagar-exemplo': apagarExemplo(); break;
    case 'exp-json': fazerBackup(); break;
    case 'bk-adiar': bkSetPref({adiarAte:Date.now()+3*DIA}); render(); toast('Vamos lembrar de novo em 3 dias'); break;
    case 'bk-ocultar': bkSetPref({adiarAte:bkUltimo()+bkPref().dias*DIA}); render(); toast('Aviso oculto até o próximo backup. Ajuste em Mais › Backup.'); break;
    case 'imp-escolher': pausaLivre(); break;
    case 'olho': alternarOlho(v); break;
    case 'evo': UI.evoSel=Number(v); render(); break;
    case 'exp-csv': salvarArquivo('meu-dinheiro-lancamentos-'+hoje()+'.csv',csvLanc(),'text/csv'); break;
    case 'copiar': {const ta=$('#exp-txt'); navigator.clipboard&&navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado')).catch(()=>{ta.select();toast('Selecionado: copie com Ctrl+C')}); if(!navigator.clipboard){ta.select()} break}
  }
});
document.addEventListener('keydown',e=>{
  lastActivity=Date.now();
  if(lockState!=='open'){
    if(e.key==='Enter'&&e.target.id==='rc-input'){e.preventDefault();if(esqueci==='apagar')apagarTudo();else rcConfirmar();return}
    if(e.target.matches&&e.target.matches('input'))return;
    if(lockState==='locked'&&!esqueci&&/^[0-9]$/.test(e.key)){e.preventDefault();pinTecla(e.key)}
    else if(lockState==='locked'&&!esqueci&&e.key==='Backspace'){e.preventDefault();pinApagar()}
    return;
  }
  if(e.key==='Escape'&&$('#sheet-root').innerHTML)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{if(e.target.id==='busca'){UI.busca=e.target.value;render()}});
document.addEventListener('pointerdown',()=>{lastActivity=Date.now()},true);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(lockState==='open'&&temPin()&&hiddenAt&&!emPausaLivre()){const min=Number(SEG.autoLock||0);if(Date.now()-hiddenAt>=min*60000&&!voltaBio())bloquear()}
});
setInterval(()=>{if(lockState==='open'&&temPin()){const min=Number(SEG.autoLock||0);if(min>0&&Date.now()-lastActivity>=min*60000)bloquear()}},10000);
document.addEventListener('change',e=>{
  if(e.target.id==='lf-rep'){const f=$('#lf-n-f');if(f)f.hidden=e.target.value==='nao';const h=$('#lf-rep-hint');if(h)h.textContent=e.target.value==='parcelar'?'Digite o valor total: o app divide pelo número de parcelas, uma por mês.':e.target.value==='mensal'?'Cria os próximos meses como pendentes, com o mesmo valor.':'Repetir cria os próximos meses como pendentes. Parcelar divide o valor total.';return}
  if(e.target.id==='bk-mostrar'){bkSetPref({mostrar:e.target.checked,adiarAte:0});toast(e.target.checked?'Lembrete de backup ligado':'Lembrete de backup desligado');return}
  if(e.target.id==='bk-dias'){bkSetPref({dias:Number(e.target.value),adiarAte:0});render();toast('Lembrete ajustado');return}
  if(e.target.id==='sg-bio-auto'){lsSet('md_bio_auto',e.target.checked?'1':'0');toast(e.target.checked?'A digital será pedida ao abrir':'A digital só será pedida quando você tocar no botão');return}
  if(e.target.id==='sg-auto'&&temPin()){segSalvar(Object.assign({},SEG,{autoLock:Number(e.target.value),atualizadoEm:Date.now()}));toast('Bloqueio automático atualizado');return}
  if(e.target.id==='imp-file'&&e.target.files[0]){lastActivity=Date.now();const r=new FileReader();r.onload=()=>{sheetHandlers={};importar(String(r.result))};r.readAsText(e.target.files[0]);e.target.value=''}
});

boot();
})();
</script>
